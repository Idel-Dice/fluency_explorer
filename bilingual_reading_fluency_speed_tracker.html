<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FluentRead - Dual Immersion Reading Speed Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #06b6d4;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --highlight-spoken: #a7f3d0;
      --highlight-current: #fef08a;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
    }

    header h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      margin-bottom: 6px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      align-items: end;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    select, button {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: #fff;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .btn {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-danger { background-color: var(--danger); color: white; }

    .mic-status-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .target-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 12px 20px;
      border-radius: 12px;
      margin-top: 16px;
    }

    .target-badge {
      background: var(--primary);
      color: white;
      font-family: 'Fredoka', sans-serif;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .passage-container {
      margin-top: 16px;
      padding: 24px;
      background-color: #fafafa;
      border-radius: 12px;
      border: 1px solid #f1f5f9;
      min-height: 180px;
      line-height: 2;
      font-size: 1.35rem;
    }

    .word { padding: 2px 4px; border-radius: 4px; }
    .word.spoken { background-color: var(--highlight-spoken); }
    .word.current { background-color: var(--highlight-current); text-decoration: underline; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      text-align: center;
      margin-top: 20px;
    }

    .metric-card {
      background: #f8fafc;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .metric-value {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      color: var(--primary);
    }

    .metric-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .action-toolbar {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.9rem;
    }

    .history-table th, .history-table td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .badge-met { background-color: #d1fae5; color: #065f46; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
    .badge-missed { background-color: #fee2e2; color: #991b1b; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>FluentRead / Lectura Fluida</h1>
      <p>Dual Immersion Reading Speed & Accuracy Tracker</p>
    </header>

    <div class="card">
      <div class="controls-grid">
        
        <div class="control-group">
          <label for="mic-select">Microphone Device</label>
          <select id="mic-select" onchange="onMicChange()">
            <option value="">Default Microphone</option>
          </select>
          <span class="mic-status-note" id="mic-note">Scanning audio inputs...</span>
        </div>

        <div class="control-group">
          <label for="lang-select">Language</label>
          <select id="lang-select" onchange="onConfigChange()">
            <option value="en">English</option>
            <option value="es">Español (Spanish)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="grade-select">Grade Level</label>
          <select id="grade-select" onchange="onConfigChange()">
            <option value="1">1st Grade / 1º Primaria</option>
            <option value="2" selected>2nd Grade / 2º Primaria (Target: 79 WPM)</option>
            <option value="3">3rd Grade / 3º Primaria</option>
            <option value="4">4th Grade / 4º Primaria</option>
            <option value="5">5th Grade / 5º Primaria</option>
          </select>
        </div>

        <div class="control-group">
          <label for="track-select">Reading Track</label>
          <select id="track-select" onchange="loadPassage()">
          </select>
        </div>

      </div>

      <div class="target-banner">
        <div>
          <span>Target Minimum Benchmark:</span>
          <span class="target-badge" id="target-wpm-badge">79 WPM</span>
        </div>
        <button class="btn btn-secondary" style="padding: 4px 12px; font-size: 0.85rem;" onclick="pickRandomTrack()">🔀 Randomize Passage</button>
      </div>
    </div>

    <div class="card">
      <div class="passage-container" id="passage-box"></div>

      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-value" id="timer-val">00:00</div>
          <div class="metric-label">Time Elapsed</div>
        </div>
        <div class="metric-card">
          <div class="metric-value" id="wpm-val">0</div>
          <div class="metric-label">Words Per Minute</div>
        </div>
        <div class="metric-card">
          <div class="metric-value" id="accuracy-val">100%</div>
          <div class="metric-label">Speech Accuracy</div>
        </div>
      </div>

      <div class="action-toolbar">
        <button class="btn btn-primary" id="btn-start" onclick="startSession()">▶ Start Reading</button>
        <button class="btn btn-danger" id="btn-stop" onclick="stopSession()" disabled>⏹ Finish & Calculate</button>
        <button class="btn btn-secondary" onclick="resetSession()">🔄 Reset</button>
      </div>
    </div>

    <div class="card">
      <h3 style="font-family: 'Fredoka', sans-serif; margin-bottom: 12px;">Reading Session History</h3>
      <table class="history-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Lang</th>
            <th>Grade</th>
            <th>Track</th>
            <th>Time</th>
            <th>WPM</th>
            <th>Target Met</th>
          </tr>
        </thead>
        <tbody id="history-list"></tbody>
      </table>
    </div>

  </div>

  <script>
    const WPM_TARGETS = { 1: 60, 2: 79, 3: 100, 4: 115, 5: 130 };

    const PASSAGES = {
      en: {
        1: [
          { id: "A", title: "Track A: The Red Fox", text: "The quick red fox jumps over the small log. He sits under a big green tree and watches the birds fly in the sky." },
          { id: "B", title: "Track B: A Sunny Day", text: "Today is a warm and sunny day. Pam goes to the park with her dog. They play catch with a bright yellow ball." },
          { id: "C", title: "Track C: The Little Cat", text: "My little cat likes to sleep on the soft rug. When she wakes up, she drinks milk from a white dish." }
        ],
        2: [
          { id: "A", title: "Track A: The Lost Puppy", text: "Leo found a small puppy near the school garden. The puppy had brown ears and a tiny tail. Leo checked the collar and called the owner right away." },
          { id: "B", title: "Track B: Library Adventure", text: "Mia loves to visit the city library on rainy afternoons. She searches for books about ocean animals and space exploration." },
          { id: "C", title: "Track C: The Treehouse", text: "Sam and Sam's sister built a wooden treehouse in their backyard. They placed a round blue rug inside and read comics together." }
        ],
        3: [
          { id: "A", title: "Track A: The Rainforest Exploration", text: "Rainforests are full of tall trees and amazing creatures. Colorful parrots fly between the high branches, while playful monkeys swing gracefully from vines." },
          { id: "B", title: "Track B: Deep Ocean Wonders", text: "The ocean floor is home to giant squids and glowing jellyfish. Oceanographers submerge in submarine vessels to study these creatures in the dark water." }
        ],
        4: [
          { id: "A", title: "Track A: Mountain Expeditions", text: "Scaling steep mountain peaks demands careful physical preparation and reliable thermal equipment. Climbers respect unpredictable weather shifts and navigate icy glaciers together." }
        ],
        5: [
          { id: "A", title: "Track A: Space Exploration Milestones", text: "Astronomers utilize orbiting space telescopes to analyze light emitted from distant galaxies billions of light-years away. Analyzing spectral data unlocks fundamental secrets about cosmic origins." }
        ]
      },
      es: {
        1: [
          { id: "A", title: "Pista A: El Perro Lalo", text: "El perro Lalo corre en el parque. A Lalo le gusta jugar con su pelota roja y saltar alto en el pasto." },
          { id: "B", title: "Pista B: La Casa Blanca", text: "Mi casa es grande y blanca. En el jardín hay flores amarillas y un árbol alto donde cantan los pájaros." }
        ],
        2: [
          { id: "A", title: "Pista A: La Excursión Escolar", text: "La clase de la maestra Elena fue al museo de ciencias. Los estudiantes vieron esqueletos de dinosaurios y aprendieron cómo vivían hace muchos años." },
          { id: "B", title: "Pista B: Un Día en la Playa", text: "Carlos y su familia caminaron por la orilla del mar. Encontraron caracoles brillantes y construyeron un gran castillo de arena." }
        ],
        3: [
          { id: "A", title: "Pista A: La Selva Amazónica", text: "La selva amazónica tiene la mayor cantidad de plantas y animales del planeta. Los guacamayos vuelan alto mientras los jaguares caminan en silencio." }
        ],
        4: [
          { id: "A", title: "Pista A: Civilizaciones Antiguas", text: "Los mayas construyeron impresionantes pirámides de piedra y desarrollaron un calendario astronómico muy exacto observando las estrellas desde sus templos." }
        ],
        5: [
          { id: "A", title: "Pista A: La Exploración del Espacio", text: "Los telescopios modernos capturan imágenes de galaxias lejanas que emitieron su luz hace millones de años. Los científicos analizan esta radiación para entender el universo." }
        ]
      }
    };

    let currentWords = [];
    let activeWordIndex = 0;
    let timerInterval = null;
    let secondsElapsed = 0;
    let isRunning = false;
    let recognition = null;
    let activeStream = null;
    let historyData = [];

    window.addEventListener('DOMContentLoaded', () => {
      populateMicrophones();
      onConfigChange();
      loadHistory();
    });

    async function populateMicrophones() {
      const micSelect = document.getElementById('mic-select');
      const micNote = document.getElementById('mic-note');
      
      try {
        await navigator.mediaDevices.getUserMedia({ audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const audioInputs = devices.filter(device => device.kind === 'audioinput');

        micSelect.innerHTML = '<option value="">Default Microphone</option>';
        audioInputs.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Microphone ${index + 1}`;
          micSelect.appendChild(option);
        });

        micNote.innerText = "USB microphones require setting as Linux system default in Sound Settings.";
      } catch (err) {
        micNote.innerText = "Microphone access blocked or unavailable.";
      }
    }

    async function onMicChange() {
      const deviceId = document.getElementById('mic-select').value;
      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
      }
      
      if (deviceId) {
        try {
          activeStream = await navigator.mediaDevices.getUserMedia({
            audio: { deviceId: { exact: deviceId } }
          });
        } catch (err) {
          console.warn("Could not bind directly to device stream:", err);
        }
      }
    }

    function onConfigChange() {
      const lang = document.getElementById('lang-select').value;
      const grade = document.getElementById('grade-select').value;
      
      const targetWpm = WPM_TARGETS[grade] || 79;
      document.getElementById('target-wpm-badge').innerText = `${targetWpm} WPM Target`;

      const trackSelect = document.getElementById('track-select');
      trackSelect.innerHTML = '';
      
      const availableTracks = PASSAGES[lang][grade] || PASSAGES[lang][1];
      availableTracks.forEach(track => {
        const opt = document.createElement('option');
        opt.value = track.id;
        opt.text = track.title;
        trackSelect.appendChild(opt);
      });

      loadPassage();
    }

    function pickRandomTrack() {
      const trackSelect = document.getElementById('track-select');
      const options = trackSelect.options;
      if (options.length > 1) {
        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * options.length);
        } while (randomIndex === trackSelect.selectedIndex);
        trackSelect.selectedIndex = randomIndex;
        loadPassage();
      }
    }

    function loadPassage() {
      resetSession();
      const lang = document.getElementById('lang-select').value;
      const grade = document.getElementById('grade-select').value;
      const trackId = document.getElementById('track-select').value || "A";

      const tracks = PASSAGES[lang][grade] || PASSAGES[lang][1];
      const selectedPassage = tracks.find(t => t.id === trackId) || tracks[0];

      const passageBox = document.getElementById('passage-box');
      passageBox.innerHTML = '';
      
      currentWords = selectedPassage.text.trim().split(/\s+/);
      
      currentWords.forEach((wordText, idx) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.id = `word-${idx}`;
        span.innerText = wordText + ' ';
        passageBox.appendChild(span);
      });

      activeWordIndex = 0;
      updateHighlighting();
    }

    function updateHighlighting() {
      currentWords.forEach((_, idx) => {
        const el = document.getElementById(`word-${idx}`);
        if (!el) return;
        el.classList.remove('spoken', 'current');
        if (idx < activeWordIndex) {
          el.classList.add('spoken');
        } else if (idx === activeWordIndex && isRunning) {
          el.classList.add('current');
        }
      });
    }

    function startSession() {
      if (isRunning) return;
      isRunning = true;
      secondsElapsed = 0;
      activeWordIndex = 0;
      
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-stop').disabled = false;
      
      updateHighlighting();
      startTimer();
      initSpeechRecognition();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer-val').innerText = `${mins}:${secs}`;
        calculateLiveMetrics();
      }, 1000);
    }

    function calculateLiveMetrics() {
      if (secondsElapsed <= 0) return;
      const minutes = secondsElapsed / 60;
      const wpm = Math.round(activeWordIndex / minutes);
      document.getElementById('wpm-val').innerText = isNaN(wpm) ? 0 : wpm;

      const accuracy = Math.round((activeWordIndex / currentWords.length) * 100);
      document.getElementById('accuracy-val').innerText = `${Math.min(accuracy, 100)}%`;
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = document.getElementById('lang-select').value === 'es' ? 'es-ES' : 'en-US';

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.toLowerCase();
          matchSpokenWords(transcript);
        }
      };

      recognition.onend = () => {
        if (isRunning) try { recognition.start(); } catch(e){}
      };

      try { recognition.start(); } catch (err) {}
    }

    function matchSpokenWords(transcript) {
      const spokenTokens = transcript.trim().split(/\s+/);
      spokenTokens.forEach(token => {
        if (activeWordIndex < currentWords.length) {
          const targetWord = currentWords[activeWordIndex].toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "");
          const cleanToken = token.toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "");

          if (cleanToken === targetWord || targetWord.includes(cleanToken)) {
            activeWordIndex++;
            updateHighlighting();
            calculateLiveMetrics();
            if (activeWordIndex >= currentWords.length) stopSession();
          }
        }
      });
    }

    function stopSession() {
      if (!isRunning) return;
      isRunning = false;
      clearInterval(timerInterval);
      
      if (recognition) try { recognition.stop(); } catch(e) {}

      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-stop').disabled = true;

      const finalWordCount = activeWordIndex > 0 ? activeWordIndex : currentWords.length;
      const minutes = Math.max(secondsElapsed / 60, 0.01);
      const finalWpm = Math.round(finalWordCount / minutes);
      
      document.getElementById('wpm-val').innerText = finalWpm;
      saveAttempt(finalWpm);
    }

    function resetSession() {
      stopSession();
      secondsElapsed = 0;
      activeWordIndex = 0;
      document.getElementById('timer-val').innerText = "00:00";
      document.getElementById('wpm-val').innerText = "0";
      document.getElementById('accuracy-val').innerText = "100%";
      updateHighlighting();
    }

    function saveAttempt(wpm) {
      const lang = document.getElementById('lang-select').value.toUpperCase();
      const grade = document.getElementById('grade-select').value;
      const track = document.getElementById('track-select').value;
      const targetWpm = WPM_TARGETS[grade] || 79;
      const metTarget = wpm >= targetWpm;

      const attempt = {
        date: new Date().toLocaleDateString(),
        lang: lang,
        grade: `Grade ${grade}`,
        track: `Track ${track}`,
        time: `${secondsElapsed}s`,
        wpm: wpm,
        metTarget: metTarget
      };

      historyData.unshift(attempt);
      if (historyData.length > 10) historyData.pop();
      localStorage.setItem('fluentread_history', JSON.stringify(historyData));
      renderHistory();
    }

    function loadHistory() {
      const saved = localStorage.getItem('fluentread_history');
      if (saved) try { historyData = JSON.parse(saved); } catch(e) { historyData = []; }
      renderHistory();
    }

    function renderHistory() {
      const historyTable = document.getElementById('history-list');
      historyTable.innerHTML = '';
      if (historyData.length === 0) {
        historyTable.innerHTML = `<tr><td colspan="7" style="text-align:center; color: var(--text-muted);">No sessions recorded yet.</td></tr>`;
        return;
      }

      historyData.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.date}</td>
          <td>${item.lang}</td>
          <td>${item.grade}</td>
          <td>${item.track}</td>
          <td>${item.time}</td>
          <td><strong>${item.wpm} WPM</strong></td>
          <td>
            <span class="${item.metTarget ? 'badge-met' : 'badge-missed'}">
              ${item.metTarget ? 'Target Met ✓' : 'Below Target'}
            </span>
          </td>
        `;
        historyTable.appendChild(row);
      });
    }
  </script>
</body>
</html>
